version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yoomates_app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-yoomates}:${POSTGRES_PASSWORD:-yoomates_secret}@postgres:5432/${POSTGRES_DB:-yoomates}?sslmode=disable
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-yoomates-media}
      S3_USE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:-voxion_yoomates_session_secret_change_in_production}
      ENV: ${ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - yoomates_net

  postgres:
    image: postgres:16-alpine
    container_name: yoomates_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yoomates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yoomates_secret}
      POSTGRES_DB: ${POSTGRES_DB:-yoomates}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yoomates} -d ${POSTGRES_DB:-yoomates}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - yoomates_net

  redis:
    image: redis:7-alpine
    container_name: yoomates_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - yoomates_net

  minio:
    image: minio/minio:latest
    container_name: yoomates_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yoomates_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  yoomates_net:
    driver: bridge
