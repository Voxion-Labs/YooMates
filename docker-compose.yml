version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yoomates_app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_URL: ${MYSQL_USER:-yoomates}:${MYSQL_PASSWORD:-yoomates_secret}@tcp(mysql:3306)/${MYSQL_DATABASE:-yoomates}?parseTime=true&multiStatements=true
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-yoomates-media}
      S3_USE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:-voxion_yoomates_session_secret_change_in_production}
      ENV: ${ENV:-development}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - yoomates_net

  mysql:
    image: mysql:8.4
    container_name: yoomates_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-yoomates_root_secret}
      MYSQL_USER: ${MYSQL_USER:-yoomates}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-yoomates_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yoomates}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-yoomates_root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - yoomates_net

  redis:
    image: redis:7-alpine
    container_name: yoomates_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - yoomates_net

  minio:
    image: minio/minio:latest
    container_name: yoomates_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yoomates_net

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  yoomates_net:
    driver: bridge
