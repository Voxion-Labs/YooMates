name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'voxion-manifest.json'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'voxion-manifest.json'

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Go Lint, Vet & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Go Formatting
        run: |
          UNFORMATTED=$(gofmt -l cmd/ internal/ scripts/ 2>/dev/null || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files require gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Test Suite
        run: go test -v -race ./...

      - name: Build and Test C++ Audio Engine
        run: |
          mkdir -p bin
          g++ -std=c++14 -O3 -Wall -Iengine/audio/include engine/audio/src/*.cpp -o bin/yoomates-voice
          ./bin/yoomates-voice --test

      - name: Build Server Binary
        run: go build -v -o /dev/null ./cmd/server/main.go

      - name: Verify Manifest Generator
        run: go run scripts/manifest.go

  docker-build:
    name: Docker Build & Container Verification
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: yoomates:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
