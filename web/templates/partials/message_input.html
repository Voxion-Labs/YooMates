{{define "message_input"}}
<footer class="chat-input-area">
  <!-- Attachment Preview Chip (Clean Minimalist Pill) -->
  <div id="attachment-preview-bar" class="attachment-preview-bar" style="display: none;">
    <div class="attachment-preview-pill">
      <span class="preview-icon">📎</span>
      <span id="preview-filename" class="preview-filename"></span>
      <span id="preview-filesize" class="preview-filesize"></span>
      <button type="button" id="remove-attachment-btn" class="preview-remove-btn" title="Remove attachment">✕</button>
    </div>
    <div id="upload-status" class="upload-status"></div>
  </div>

  <form id="chat-input-form" ws-send hx-trigger="submit">
    <div class="input-container">
      <button type="button" id="chat-attach-trigger" class="input-btn" title="Add Attachment (Max 25MB)">
        📎
      </button>
      <input type="file" id="chat-file-input" style="display: none;" />

      <input type="hidden" name="type" value="chat">
      <input type="hidden" name="server_id" value="{{.CurrentServer.ID}}">
      <input type="hidden" name="channel_id" value="{{.CurrentChannel.ID}}">
      <input type="hidden" name="file_url" id="chat-file-url" value="">
      <input type="hidden" name="file_name" id="chat-file-name" value="">
      <input type="hidden" name="file_type" id="chat-file-type" value="">
      <input type="hidden" name="file_size" id="chat-file-size" value="">

      <input 
        type="text" 
        name="content" 
        id="chat-input-field" 
        class="chat-input" 
        placeholder="Message #{{if .CurrentChannel.Name}}{{.CurrentChannel.Name}}{{else}}general{{end}} (Press Enter to send, Ctrl+K to focus)" 
        autocomplete="off"
        autofocus
      >

      <button type="submit" class="input-btn" title="Send Message">
        ➤
      </button>
    </div>
  </form>
</footer>
{{end}}
