{{define "message_item"}}
<article class="message-item" id="msg-{{.ID}}">
  <div class="msg-avatar">
    {{.Initials}}
  </div>
  <div class="msg-content-box">
    <header class="msg-meta">
      <span class="msg-author">{{.AuthorName}}</span>
      <time class="msg-time">{{.FormattedTime}}</time>
    </header>
    {{if .Content}}
    <div class="msg-body">{{.Content}}</div>
    {{end}}
    {{if .FileURL}}
    <div class="msg-attachment-box">
      {{if isImage .FileURL}}
      <a href="{{.FileURL}}" target="_blank" rel="noopener noreferrer">
        <img src="{{.FileURL}}" alt="{{if .FileName}}{{.FileName}}{{else}}Image{{end}}" class="msg-attachment-img" loading="lazy">
      </a>
      {{else}}
      <a href="{{.FileURL}}" target="_blank" rel="noopener noreferrer" class="msg-attachment-card">
        <span class="attachment-icon">📎</span>
        <div class="attachment-info">
          <span class="attachment-name">{{if .FileName}}{{.FileName}}{{else}}Attachment{{end}}</span>
          {{if .FileSize}}<span class="attachment-meta">{{formatSize .FileSize}}</span>{{end}}
        </div>
        <span class="attachment-download">⬇</span>
      </a>
      {{end}}
    </div>
    {{end}}
    <!-- Reactions Container -->
    <div id="reactions-msg-{{.ID}}" class="msg-reactions"></div>
  </div>

  <!-- Minimalist Hover Actions -->
  <div class="msg-actions">
    <button class="action-btn" title="React Thumbs Up" ws-send hx-vals='{"type":"reaction","message_id":"{{.ID}}","emoji":"👍"}'>👍</button>
    <button class="action-btn" title="React Heart" ws-send hx-vals='{"type":"reaction","message_id":"{{.ID}}","emoji":"❤️"}'>❤️</button>
    <button class="action-btn" title="React Fire" ws-send hx-vals='{"type":"reaction","message_id":"{{.ID}}","emoji":"🔥"}'>🔥</button>
    <button class="action-btn" title="Delete Message" ws-send hx-vals='{"type":"delete","message_id":"{{.ID}}"}'>🗑</button>
  </div>
</article>
{{end}}
